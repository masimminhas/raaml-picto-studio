# about.ini
# Branding for the RAAML Picto Studio feature.
# Contains externalized strings for feature branding shown in
# Help > About > Installation Details > Features.
# Keys:
#    aboutText - text shown for this feature in the feature list
#    featureImage - 32x32 image shown next to the feature in the list

featureImage=feature_image.png

aboutText=RAAML Picto Studio\n\
\n\
A model-driven safety analysis workbench built on Eclipse Epsilon and Picto. \
Provides live, interactive HTML visualizations for ISO 26262 safety analyses \
(FMEA, FTA, HARA, STPA, GSN, HAZOP, Requirements) using the RAAML metamodel.\n\
\n\
Source: https://github.com/masimminhas/raaml-picto-studio\n\
Update Site: https://masimminhas.github.io/raaml-picto-studio/
